# Demo de l'application en ligne, pour l'essayer sur iPhone (Safari -> « Sur l'ecran d'accueil ») ou n'importe ou :
# https://raphaelgrj.github.io/microduck-brain/?demo - l'interface du canard avec un canard imaginaire (demo.js),
# entierement dans le navigateur. Publiee a chaque changement de interface/ (Settings -> Pages -> Source : GitHub Actions).
name: Pages
on:
  push:
    branches: ["main"]
    paths: ["interface/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: interface
      - id: deploiement
        uses: actions/deploy-pages@v4
