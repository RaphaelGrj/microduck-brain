# /etc/asound.conf du canard : partager le MICRO entre robotd (caresse audio, sentinelle des sons) et le cerveau
# (reflexes sonores et commandes vocales locales). NON TESTE (robot pas livre) ; carte "aic3104" = le codec
# TLV320AIC3104 que robotd utilise (plughw:aic3104). Le haut-parleur n'est PAS touche.
#
# Cote robotd (/etc/robot/robotd.toml), avec contrib/robotd-audio-capture.patch :
#   [audio]
#   capture = "micro_partage"
#   pet_detect = true            # la caresse officielle (audio) est desactivee par defaut
# Cote cerveau : MICRODUCK_MICRO=micro_partage (deploy/robot/microduck-cerveau.service) et canard.py --micro.

pcm.micro_brut {
    type dsnoop
    ipc_key 20261005            # identifiant partage entre les lecteurs
    ipc_perm 0666               # robotd et le cerveau tournent sous des comptes differents
    slave {
        pcm "hw:aic3104,0"
        rate 16000              # les deux lecteurs veulent du 16 kHz (pet-detect, audio.py, Vosk)
    }
}

pcm.micro_partage {
    type plug                   # conversion de canaux/format si le codec capture en stereo
    slave.pcm "micro_brut"
}
