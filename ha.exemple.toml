# ====================================================================================================
#  CONFIGURATION LOCALE DE MICRODUCK  (modèle SANS secret — le vrai fichier s'appelle `ha.toml`)
#
#  `ha.toml` contient le jeton de ta maison : il est dans .gitignore, ne le mets JAMAIS sur GitHub ni dans un
#  message. Remplace chaque "A_REMPLIR" ; ce que tu laisses tel quel est simplement ignoré.
#  Ensuite :  bash ~/run-brain.sh pont_ha.py ha.toml --verifier     (teste tout et liste tes imprimantes)
# ====================================================================================================

# ---- 1. Home Assistant (Raspberry Pi 3B+ sous HA OS) -----------------------------------------------
[home_assistant]
url   = "http://A_REMPLIR:8123"     # IP du Pi, ex. "http://192.168.1.50:8123" (l'IP est plus sûre que homeassistant.local)
token = "A_REMPLIR"                 # Jeton d'accès longue durée : HA -> ton profil (en bas à gauche) -> Sécurité
                                    # -> Jetons d'accès longue durée -> Créer. Il ne s'affiche qu'UNE fois : copie-le ici.
interrupteur_calme = "input_boolean.microduck_calme"   # regle de vie : a creer dans HA (Entrees -> Interrupteur) ;
                                    # actif = le canard s'assoit, se tait et ne bouge plus (nuit, visite, film...)
satellite_vocal = "A_REMPLIR"       # plus tard, quand quacksat (mode wyoming) tournera sur le canard : son entité
                                    # assist_satellite.* (--verifier la liste). Pendant une conversation, le cerveau se
                                    # tait et ne bouge plus (quacksat pilote alors la tête et la marche).
publier_toutes_les_s = 30           # rafraîchissement des entités sensor.microduck_* (inutile de descendre sous 10)

# ---- 2. MQTT (facultatif : add-on "Mosquitto broker" de HA OS) -------------------------------------
# Avec MQTT, HA crée tout seul un appareil "Microduck" (entités éditables, gardées au redémarrage, "indisponible"
# si le cerveau s'arrête) et un interrupteur switch.microduck_calme : l'input_boolean ci-dessus devient inutile.
# Sans MQTT, l'état du canard passe par l'API REST (rien à installer, mais entités plus fragiles).
[mqtt]
actif = false                       # passe à true une fois Mosquitto installé
hote = "A_REMPLIR"                  # en général la même IP que Home Assistant
port = 1883
utilisateur = "A_REMPLIR"           # un utilisateur créé pour le canard dans HA (Paramètres -> Personnes), pas ton compte admin
mot_de_passe = "A_REMPLIR"

# ---- 3. Réseau : où tourne quoi (pour que je règle l'architecture) ---------------------------------
[reseau]
cerveau_sur = "A_REMPLIR"           # "pc", "pi" (autre Raspberry Pi), "telephone" ou "robot"
cerveau_ip = "A_REMPLIR"            # IP de la machine qui fera tourner le cerveau (si ce n'est pas le PC)
cerveau_modele = "A_REMPLIR"        # ex. "Raspberry Pi 4 2 Go", "Pi Zero 2 W", "S24+"
robot_ip = "A_REMPLIR"              # IP du Microduck quand il sera livré
robot_utilisateur_ssh = "A_REMPLIR"
etat_hz = 25                        # trames d'état du robot par seconde (10 à 50). Moins = moins de CPU/réseau sur un petit Pi

# ---- 4. Imprimantes surveillées --------------------------------------------------------------------
# `entite` : le entity_id de l'ÉTAT de l'imprimante dans HA (Outils de développement -> États), ou lance
#            `--verifier` qui te liste ce qui ressemble à une imprimante.
# `type`   : "prusalink" => états connus (finished, stopped, error, attention, printing) déjà gérés.
#            Pour une autre intégration (Elegoo...), écris `reactions` toi-même une fois que tu as vu les états réels.
[[imprimante]]
nom = "Prusa 1"
type = "prusalink"
entite = "A_REMPLIR"                # ex. "sensor.prusa_mk4s_etat_de_l_imprimante" (à vérifier chez toi)

[[imprimante]]
nom = "Prusa 2"
type = "prusalink"
entite = "A_REMPLIR"

[[imprimante]]
nom = "Saturn 4 Ultra"
type = "elegoo"
entite = "A_REMPLIR"
# Après avoir vu les vrais états de l'imprimante dans HA, décommente et adapte (états en minuscules ou comme affichés) :
# reactions = { complete = "impression_finie", failed = "impression_echec", stopped = "impression_echec" }

# ---- 5. Habitants (accueil au retour) --------------------------------------------------------------
# `entite` : la personne dans HA (Paramètres -> Personnes ; suivie par l'appli Home Assistant du téléphone),
#            `--verifier` liste les `person.*`. Le canard t'accueille quand tu passes de "absent" (ou d'une zone) à
#            "home" : réservé au début, plus chaleureux avec le temps, petit signe si tu n'es sorti que 5 min, joie après
#            une longue journée. Rien en mode calme ; pendant sa sieste, seul un retour après 4 h d'absence le réveille.
#            Le prénom n'est utilisé qu'en local (mémoire du canard, hors dépôt).
[[habitant]]
nom = "A_REMPLIR"                   # un prénom ou surnom
entite = "A_REMPLIR"                # ex. "person.raphael"

# ---- 6. Tes notes (ignorées par le programme) ------------------------------------------------------
[notes]
libre = """
Écris ici ce que tu veux me dire : noms de pièces, habitudes, ce qui doit réveiller / ne pas réveiller le canard...
"""
